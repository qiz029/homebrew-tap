name: Bump formula

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Use the formula generated with the qualified standalone archives. Incomplete
      # releases fail before changing the tap; terminal distribution no longer follows npm.
      - name: Follow the published application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/bump.mjs
          ruby -c Formula/dscode.rb
          if git diff --quiet; then echo 'already current'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update DSCODE to the published standalone package"
          git push
